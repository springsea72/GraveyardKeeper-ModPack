## Settings file was created by plugin Graveyard Keeper Auto Regen v1.0.0
## Plugin GUID: local.chunhai.graveyardkeeper.autoregen

[Debug]

## Write HP regeneration progress to the BepInEx log.
# Setting type: Boolean
# Default value: false
LogHeals = false

[General]

## Regenerate player HP outside sleep.
# Setting type: Boolean
# Default value: true
EnableAutoRegen = true

## HP regeneration multiplier relative to the normal sleep HP recovery rate. 0.1 means one tenth.
# Setting type: Single
# Default value: 0.1
SleepRateMultiplier = 0.2

## Continue HP regeneration while the game is paused.
# Setting type: Boolean
# Default value: false
RegenWhilePaused = false

## Also run this mod while the sleep GUI is shown. Keep this disabled to avoid stacking with normal sleep healing.
# Setting type: Boolean
# Default value: false
RegenDuringSleepGui = false

