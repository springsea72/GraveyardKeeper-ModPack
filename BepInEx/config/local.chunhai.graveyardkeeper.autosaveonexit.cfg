## Settings file was created by plugin Graveyard Keeper Auto Save On Exit v1.1.0
## Plugin GUID: local.chunhai.graveyardkeeper.autosaveonexit

[DailyAutoSave]

## Save automatically after each in-game day passes.
# Setting type: Boolean
# Default value: true
SaveOnEachNewDay = true

## Delay in real seconds before saving after a new in-game day starts.
# Setting type: Single
# Default value: 1
NewDaySaveDelaySeconds = 1

## Delay the new-day autosave while the sleep GUI is shown to avoid overlapping the base game's wake-up save.
# Setting type: Boolean
# Default value: true
DelayNewDaySaveWhileSleepGui = true

[General]

## Save before the in-game menu returns to the main menu.
# Setting type: Boolean
# Default value: true
SaveBeforeReturnToMainMenu = true

## Try a synchronous save when the application is closing while a game is active.
# Setting type: Boolean
# Default value: true
SaveOnApplicationQuit = true

